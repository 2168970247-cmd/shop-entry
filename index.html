<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>织雾网络</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; }
    * { box-sizing: border-box; }
    html, body, main { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .loading { position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; justify-items: center; gap: 12px; background: #f8fafc; color: #64748b; font-size: 14px; }
    .spinner { width: 30px; height: 30px; border: 3px solid #dbe4ee; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
    .notice { position: fixed; inset: auto 0 0; z-index: 2; padding: 12px 16px; border-top: 1px solid #dbe4ee; background: #f8fafc; color: #475569; text-align: center; font-size: 14px; line-height: 1.6; }
    .notice p { margin: 0; }
    .notice.invalid { inset: 0; display: grid; place-content: center; padding: 24px; }
    a { color: #2563eb; }
    [hidden] { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="loading" id="loading" role="status"><span class="spinner" aria-hidden="true"></span><span>正在打开页面…</span></div>
    <div class="notice" id="notice" role="status" hidden><p id="message">页面加载较慢，请稍候，或<a id="direct-link" href="https://m.zhiwuhaoka.xyz/">直接打开店铺</a>。</p></div>
    <iframe id="content" title="织雾网络店铺" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write; camera; geolocation"></iframe>
    <noscript><div class="notice invalid">请启用浏览器 JavaScript 后重新打开此链接。</div></noscript>
  </main>
  <script>
    (() => {
      const frame = document.getElementById('content')
      const loading = document.getElementById('loading')
      const notice = document.getElementById('notice')
      const message = document.getElementById('message')
      const direct = document.getElementById('direct-link')
      const requested = new URLSearchParams(window.location.search)
      const product = requested.get('plan')
      const basePath = '/shop-entry'
      const requestedPath = window.location.pathname.replace(new RegExp('^' + basePath + '(?=/|$)'), '') || '/'
      const path = product ? '/plan/' + product : requestedPath === '/index.html' || requestedPath === '/404.html' ? '/' : requestedPath
      if (path !== '/' && !/^\/plan\/[1-9]\d*\/?$/.test(path)) {
        loading.hidden = true
        frame.hidden = true
        message.textContent = '商品链接无效，请核对推广链接后重新打开。'
        notice.classList.add('invalid')
        notice.hidden = false
        return
      }
      requested.delete('plan')
      const query = requested.toString()
      const target = new URL(path + (query ? '?' + query : '') + window.location.hash, 'https://m.zhiwuhaoka.xyz/')
      const timer = window.setTimeout(() => {
        loading.hidden = true
        notice.hidden = false
      }, 10000)
      frame.addEventListener('load', () => {
        window.clearTimeout(timer)
        loading.hidden = true
        notice.hidden = true
      })
      direct.href = target.href
      frame.src = target.href
    })()
  </script>
</body>
</html>
